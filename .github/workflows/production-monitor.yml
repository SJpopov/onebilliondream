name: Production monitor

on:
  schedule:
    - cron: "*/15 * * * *"
    # Weekly keepalive: GitHub disables scheduled workflows after 60 days
    # without repository activity; re-enabling via the API resets that timer.
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production-monitor.yml"
      - "scripts/check-production.mjs"
      - "index.html"
      - "site.css"
      - "privacy.html"
      - "play.html"
      - "wall-of-dreamers.html"
      - "sitemap.xml"
      - "robots.txt"
      - "_headers"
      - "_redirects"

permissions:
  contents: read

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  check-production:
    name: Check live site
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out monitoring code
        uses: actions/checkout@v5

      - name: Allow production deployment to complete
        if: github.event_name == 'push'
        run: sleep 90

      - name: Check production
        run: node scripts/check-production.mjs

  keepalive:
    name: Keep scheduled monitor enabled
    if: github.event.schedule == '17 6 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/production-monitor.yml/enable"
