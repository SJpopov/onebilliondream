<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Play — One Billion Dream</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://onebilliondream.com/play">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#c9a84c;--gold-dim:#8a6d2f;--cream:#f5f0e8;--dark:#07090f;--blue:#4a9eda;--muted:rgba(245,240,232,0.45)}
html,body{height:100%;background:var(--dark);color:var(--cream);font-family:'Space Mono',monospace;overflow:hidden}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.star{position:absolute;border-radius:50%;background:white;animation:twinkle var(--d,3s) ease-in-out infinite var(--delay,0s);opacity:0}
@keyframes twinkle{0%,100%{opacity:0}50%{opacity:var(--peak,0.8)}}
#game-wrap{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.6rem;padding:1rem}
#top-bar{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:520px}
.back-link{font-size:10px;letter-spacing:0.15em;color:var(--gold-dim);text-decoration:none;text-transform:uppercase;transition:color 0.2s}
.back-link:hover{color:var(--gold)}
#level-info{font-size:10px;letter-spacing:0.2em;color:var(--muted);text-transform:uppercase;text-align:center}
#level-info span{color:var(--gold)}
#move-info{font-size:10px;letter-spacing:0.15em;color:var(--muted);text-transform:uppercase;text-align:right}
#move-info span{color:var(--cream)}
canvas{border:1px solid rgba(201,168,76,0.2);border-radius:2px;image-rendering:pixelated;touch-action:none;cursor:default}
#controls{display:flex;gap:0.6rem;align-items:center}
.ctrl-btn{background:transparent;border:1px solid rgba(201,168,76,0.2);color:var(--muted);font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;padding:0.4rem 0.9rem;border-radius:2px;cursor:pointer;transition:all 0.2s}
.ctrl-btn:hover{border-color:var(--gold);color:var(--gold)}
.ctrl-btn:disabled{opacity:0.3;cursor:not-allowed}
#undo-btn{position:relative}
#undo-count{position:absolute;top:-6px;right:-6px;background:var(--gold);color:var(--dark);font-size:8px;font-weight:700;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center}
#hint{font-family:'Cormorant Garamond',serif;font-size:0.85rem;color:rgba(245,240,232,0.25);font-style:italic}
#win-overlay{display:none;position:fixed;inset:0;z-index:50;background:rgba(7,9,15,0.92);align-items:center;justify-content:center;flex-direction:column;gap:1.5rem;text-align:center}
#win-overlay.show{display:flex}
#win-overlay h2{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,6vw,3.5rem);font-weight:300;color:var(--gold)}
#win-overlay p{font-size:11px;letter-spacing:0.2em;color:var(--muted);text-transform:uppercase}
.win-btn{background:var(--gold);border:1px solid var(--gold);color:var(--dark);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.15em;text-transform:uppercase;padding:0.8rem 2rem;border-radius:2px;cursor:pointer;transition:all 0.2s}
.win-btn:hover{background:transparent;color:var(--gold)}
#bonus-toast{display:none;position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.4);color:var(--gold);font-size:10px;letter-spacing:0.15em;text-transform:uppercase;padding:0.5rem 1.25rem;border-radius:2px;z-index:100}
#dpad{display:none;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:4px}
@media (pointer:coarse){#dpad{display:grid}#hint{display:none}}
.dpad-btn{background:rgba(245,240,232,0.05);border:1px solid rgba(201,168,76,0.15);color:var(--cream);font-size:18px;border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;user-select:none}
.dpad-btn:active{background:rgba(201,168,76,0.2)}
.dpad-empty{background:transparent;border:none}
</style>
</head>
<body>
<div id="stars"></div>
<div id="bonus-toast"></div>
<div id="game-wrap">
  <div id="top-bar">
    <a href="/" class="back-link">← dream</a>
    <div id="level-info">Level <span id="lvl-num">1</span> / <span id="lvl-total">155</span></div>
    <div id="move-info">Moves: <span id="moves">0</span></div>
  </div>
  <canvas id="canvas" tabindex="0"></canvas>
  <div id="controls">
    <button class="ctrl-btn" id="undo-btn" onclick="undoMove()">↩ Undo<span id="undo-count">1</span></button>
    <button class="ctrl-btn" onclick="restartLevel()">↺ Restart</button>
    <button class="ctrl-btn" onclick="skipLevel()">Skip →</button>
  </div>
  <div id="dpad">
    <div class="dpad-empty"></div>
    <button class="dpad-btn" onpointerdown="move(0,-1)">▲</button>
    <div class="dpad-empty"></div>
    <button class="dpad-btn" onpointerdown="move(-1,0)">◀</button>
    <div class="dpad-empty"></div>
    <button class="dpad-btn" onpointerdown="move(1,0)">▶</button>
    <div class="dpad-empty"></div>
    <button class="dpad-btn" onpointerdown="move(0,1)">▼</button>
    <div class="dpad-empty"></div>
  </div>
  <p id="hint">arrow keys · push boxes onto targets · click canvas first</p>
</div>
<div id="win-overlay">
  <h2>Level Complete</h2>
  <p>Solved in <span id="win-move-count"></span> moves</p>
  <p id="win-bonus" style="color:var(--gold);display:none">+1 undo earned!</p>
  <button class="win-btn" onclick="nextLevel()">Next Level →</button>
</div>

// Level themes — different style every 10 levels
const THEMES=[
  {wall:'#1a1f35',wallBorder:'rgba(201,168,76,0.3)',floor:'#080c18',box:'#2a4a6a',boxBorder:'#4a9eda',target:'#c9a84c',boxDone:'#1a3a2a',boxDoneBorder:'#4aeda8'},
  {wall:'#1f1a2f',wallBorder:'rgba(180,120,255,0.3)',floor:'#0c0818',box:'#3a2a6a',boxBorder:'#9a6aff',target:'#ff9a4a',boxDone:'#2a1a4a',boxDoneBorder:'#ff6aaa'},
  {wall:'#1a2a1a',wallBorder:'rgba(74,218,120,0.3)',floor:'#080e08',box:'#1a3a2a',boxBorder:'#4aed8a',target:'#edc84a',boxDone:'#2a4a1a',boxDoneBorder:'#8aff4a'},
  {wall:'#2a1a1a',wallBorder:'rgba(255,100,80,0.3)',floor:'#0e0808',box:'#4a1a1a',boxBorder:'#ff6a4a',target:'#4aedca',boxDone:'#2a1a1a',boxDoneBorder:'#ffca4a'},
  {wall:'#1a2030',wallBorder:'rgba(100,180,255,0.3)',floor:'#080c14',box:'#1a3050',boxBorder:'#64b4ff',target:'#ffb464',boxDone:'#1a3028',boxDoneBorder:'#64ffb4'},
];

const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let currentLevel=0,grid=[],playerX=0,playerY=0,moves=0,savedState=null;
let undosLeft=1,levelsWithoutUndo=0,undoUsedThisLevel=false;
const MAX_UNDO=3;
const VOID=0,WALL=1,FLOOR=2,BOX=3,TARGET=4,BOX_T=5,PLAYER=6,PLR_T=7;

function getTheme(lvl){ return THEMES[Math.floor(lvl/10)%THEMES.length]; }

function updateUndoBtn(){
  document.getElementById('undo-btn').disabled=undosLeft<=0||!savedState;
  document.getElementById('undo-count').textContent=undosLeft;
}

function showToast(msg){
  const t=document.getElementById('bonus-toast');
  t.textContent=msg;t.style.display='block';
  setTimeout(()=>t.style.display='none',2500);
}

function parseLevel(rows){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const g=[];let px=0,py=0;
  for(let y=0;y<h;y++){
    g[y]=new Array(w).fill(VOID);
    for(let x=0;x<w;x++){
      const ch=rows[y][x]||' ';
      if(ch==='#'){g[y][x]=WALL;}
      else if(ch==='.'){ g[y][x]=TARGET;}
      else if(ch==='$'){g[y][x]=BOX;}
      else if(ch==='*'){g[y][x]=BOX_T;}
      else if(ch==='@'){g[y][x]=PLAYER;px=x;py=y;}
      else if(ch==='+'){g[y][x]=PLR_T;px=x;py=y;}
    }
  }
  // Flood fill from player to mark interior floor as FLOOR
  const queue=[[px,py]];
  const visited=new Set();
  while(queue.length){
    const [cx,cy]=queue.pop();
    const key=cx+','+cy;
    if(visited.has(key))continue;
    visited.add(key);
    if(cy<0||cy>=h||cx<0||cx>=w)continue;
    if(g[cy][cx]===WALL)continue;
    if(g[cy][cx]===VOID)g[cy][cx]=FLOOR;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=cx+dx,ny=cy+dy;
      if(!visited.has(nx+','+ny))queue.push([nx,ny]);
    }
  }
  return{grid:g,px,py,w,h};
}

function loadLevel(idx){
  const p=parseLevel(LEVELS[idx]);
  grid=p.grid;playerX=p.px;playerY=p.py;moves=0;savedState=null;undoUsedThisLevel=false;
  document.getElementById('lvl-num').textContent=idx+1;
  document.getElementById('lvl-total').textContent=LEVELS.length;
  document.getElementById('moves').textContent=0;
  resizeCanvas(p.w,p.h);updateUndoBtn();draw();
  canvas.focus();
}

function resizeCanvas(w,h){
  const maxW=Math.min(window.innerWidth-32,520);
  const maxH=window.innerHeight-200;
  const t=Math.max(14,Math.min(Math.floor(maxW/w),Math.floor(maxH/h),42));
  canvas.width=w*t;canvas.height=h*t;canvas._tile=t;
}

function drawBox(ctx,px,py,t,solid,border,done){
  const m=Math.round(t*0.08),r=Math.round(t*0.12);
  const bx=px+m,by=py+m,bw=t-m*2,bh=t-m*2;
  // Solid fill
  ctx.fillStyle=solid;
  ctx.beginPath();ctx.roundRect(bx,by,bw,bh,r);ctx.fill();
  // Brick pattern
  ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=0.5;
  const brickH=Math.round(bh/3);
  for(let row=0;row<3;row++){
    const oy=by+row*brickH;
    const offset=(row%2===0)?0:Math.round(bw/3);
    ctx.beginPath();ctx.moveTo(bx,oy);ctx.lineTo(bx+bw,oy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx+offset+Math.round(bw/3),oy);ctx.lineTo(bx+offset+Math.round(bw/3),oy+brickH);ctx.stroke();
  }
  // Border
  ctx.strokeStyle=border;ctx.lineWidth=done?2:1.5;
  ctx.beginPath();ctx.roundRect(bx+0.5,by+0.5,bw-1,bh-1,r);ctx.stroke();
  if(done){
    ctx.fillStyle=border;ctx.font=`bold ${Math.round(t*0.35)}px monospace`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('✓',px+t/2,py+t/2);
  }
}

function draw(){
  const t=canvas._tile||28,h=grid.length,w=grid[0].length;
  const theme=getTheme(currentLevel);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const cell=grid[y][x],px=x*t,py=y*t;
      if(cell===VOID)continue;
      if(cell===WALL){
        ctx.fillStyle=theme.wall;ctx.fillRect(px,py,t,t);
        ctx.strokeStyle=theme.wallBorder;ctx.lineWidth=0.5;
        ctx.strokeRect(px+.5,py+.5,t-1,t-1);
        // Wall cross pattern
        ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=0.5;
        ctx.beginPath();ctx.moveTo(px,py+t/2);ctx.lineTo(px+t,py+t/2);ctx.stroke();
        ctx.beginPath();ctx.moveTo(px+t/2,py);ctx.lineTo(px+t/2,py+t);ctx.stroke();
      } else {
        ctx.fillStyle=theme.floor;ctx.fillRect(px,py,t,t);
        // Subtle floor grid
        ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.lineWidth=0.5;
        ctx.strokeRect(px+.5,py+.5,t-1,t-1);
      }
      if(cell===TARGET||cell===PLR_T){
        const m=t*0.28;
        ctx.strokeStyle=theme.target;ctx.lineWidth=1.5;
        ctx.strokeRect(px+m,py+m,t-m*2,t-m*2);
        ctx.fillStyle='rgba(255,255,255,0.04)';
        ctx.fillRect(px+m,py+m,t-m*2,t-m*2);
        // X mark on target
        ctx.strokeStyle=theme.target;ctx.lineWidth=1;ctx.globalAlpha=0.5;
        ctx.beginPath();ctx.moveTo(px+m,py+m);ctx.lineTo(px+t-m,py+t-m);ctx.stroke();
        ctx.beginPath();ctx.moveTo(px+t-m,py+m);ctx.lineTo(px+m,py+t-m);ctx.stroke();
        ctx.globalAlpha=1;
      }
      if(cell===BOX){drawBox(ctx,px,py,t,theme.box,theme.boxBorder,false);}
      if(cell===BOX_T){drawBox(ctx,px,py,t,theme.boxDone,theme.boxDoneBorder,true);}
      if(cell===PLAYER||cell===PLR_T){drawPlayer(px+t/2,py+t/2,t);}
    }
  }
}

function drawPlayer(cx,cy,t){
  const s=t*0.17;
  ctx.save();
  ctx.strokeStyle='#f5f0e8';ctx.lineWidth=Math.max(1.5,t*0.07);ctx.lineCap='round';
  ctx.beginPath();ctx.arc(cx,cy-s*2.2,s,0,Math.PI*2);ctx.fillStyle='#f5f0e8';ctx.fill();
  ctx.beginPath();ctx.moveTo(cx,cy-s*1.2);ctx.lineTo(cx,cy+s*1.2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-s*1.2,cy-s*0.3);ctx.lineTo(cx+s*1.2,cy-s*0.3);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx,cy+s*1.2);ctx.lineTo(cx-s*0.9,cy+s*2.5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx,cy+s*1.2);ctx.lineTo(cx+s*0.9,cy+s*2.5);ctx.stroke();
  ctx.restore();
}

function move(dx,dy){
  const nx=playerX+dx,ny=playerY+dy;
  if(ny<0||ny>=grid.length||nx<0||nx>=grid[0].length)return;
  const dest=grid[ny][nx];
  if(dest===VOID||dest===WALL)return;
  const snap=JSON.parse(JSON.stringify(grid));
  const spx=playerX,spy=playerY;
  if(dest===BOX||dest===BOX_T){
    const bx=nx+dx,by=ny+dy;
    if(by<0||by>=grid.length||bx<0||bx>=grid[0].length)return;
    const beyond=grid[by][bx];
    if(beyond===VOID||beyond===WALL||beyond===BOX||beyond===BOX_T)return;
    grid[by][bx]=(beyond===TARGET)?BOX_T:BOX;
    grid[ny][nx]=(dest===BOX_T)?TARGET:FLOOR;
  }
  grid[spy][spx]=(grid[spy][spx]===PLR_T)?TARGET:FLOOR;
  grid[ny][nx]=(grid[ny][nx]===TARGET)?PLR_T:PLAYER;
  playerX=nx;playerY=ny;moves++;
  document.getElementById('moves').textContent=moves;
  savedState={grid:snap,px:spx,py:spy,moves:moves-1};
  updateUndoBtn();draw();checkWin();
}

function undoMove(){
  if(!savedState||undosLeft<=0)return;
  grid=savedState.grid;playerX=savedState.px;playerY=savedState.py;moves=savedState.moves;
  document.getElementById('moves').textContent=moves;
  savedState=null;undosLeft--;undoUsedThisLevel=true;
  updateUndoBtn();draw();
}

function restartLevel(){loadLevel(currentLevel);}
function skipLevel(){levelsWithoutUndo=0;currentLevel=(currentLevel+1)%LEVELS.length;loadLevel(currentLevel);}

function nextLevel(){
  document.getElementById('win-overlay').classList.remove('show');
  document.getElementById('win-bonus').style.display='none';
  if(!undoUsedThisLevel){
    levelsWithoutUndo++;
    if(levelsWithoutUndo>=10&&undosLeft<MAX_UNDO){undosLeft++;levelsWithoutUndo=0;showToast('+1 undo earned!');}
  } else {levelsWithoutUndo=0;}
  currentLevel=(currentLevel+1)%LEVELS.length;
  loadLevel(currentLevel);
}

function checkWin(){
  for(let y=0;y<grid.length;y++)for(let x=0;x<grid[y].length;x++)if(grid[y][x]===BOX)return;
  document.getElementById('win-move-count').textContent=moves;
  const bonus=!undoUsedThisLevel&&levelsWithoutUndo+1>=10&&undosLeft<MAX_UNDO;
  document.getElementById('win-bonus').style.display=bonus?'block':'none';
  document.getElementById('win-overlay').classList.add('show');
}

document.addEventListener('keydown',e=>{
  switch(e.key){
    case'ArrowUp':case'w':case'W':e.preventDefault();move(0,-1);break;
    case'ArrowDown':case's':case'S':e.preventDefault();move(0,1);break;
    case'ArrowLeft':case'a':case'A':e.preventDefault();move(-1,0);break;
    case'ArrowRight':case'd':case'D':e.preventDefault();move(1,0);break;
    case'z':case'Z':undoMove();break;
    case'r':case'R':restartLevel();break;
  }
});

canvas.addEventListener('click',()=>canvas.focus());
let tx=0,ty=0;
canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;e.preventDefault();},{passive:false});
canvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<12&&Math.abs(dy)<12)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy>0?1:-1);
  e.preventDefault();
},{passive:false});

const starsEl=document.getElementById('stars');
for(let i=0;i<120;i++){const s=document.createElement('div');s.className='star';const sz=Math.random()<.8?1:2;s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*6}s;--peak:${0.3+Math.random()*.7};`;starsEl.appendChild(s);}

loadLevel(0);
window.addEventListener('resize',()=>{const p=parseLevel(LEVELS[currentLevel]);resizeCanvas(p.w,p.h);draw();});
</script>
