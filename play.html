<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Play — One Billion Dream</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--gold:#c9a84c;--gold-dim:#8a6d2f;--cream:#f5f0e8;--dark:#07090f;--blue:#4a9eda;--muted:rgba(245,240,232,0.45)}
  html,body{height:100%;background:var(--dark);color:var(--cream);font-family:'Space Mono',monospace;overflow:hidden}
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  .star{position:absolute;border-radius:50%;background:white;animation:twinkle var(--d,3s) ease-in-out infinite var(--delay,0s);opacity:0}
  @keyframes twinkle{0%,100%{opacity:0}50%{opacity:var(--peak,0.8)}}
  #game-wrap{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.6rem;padding:1rem}
  #top-bar{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:520px}
  .back-link{font-size:10px;letter-spacing:0.15em;color:var(--gold-dim);text-decoration:none;text-transform:uppercase;transition:color 0.2s}
  .back-link:hover{color:var(--gold)}
  #level-info{font-size:10px;letter-spacing:0.2em;color:var(--muted);text-transform:uppercase;text-align:center}
  #level-info span{color:var(--gold)}
  #move-info{font-size:10px;letter-spacing:0.15em;color:var(--muted);text-transform:uppercase;text-align:right}
  #move-info span{color:var(--cream)}
  canvas{border:1px solid rgba(201,168,76,0.2);border-radius:2px;image-rendering:pixelated;touch-action:none}
  #controls{display:flex;gap:0.6rem;align-items:center}
  .ctrl-btn{background:transparent;border:1px solid rgba(201,168,76,0.2);color:var(--muted);font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;padding:0.4rem 0.9rem;border-radius:2px;cursor:pointer;transition:all 0.2s}
  .ctrl-btn:hover{border-color:var(--gold);color:var(--gold)}
  .ctrl-btn:disabled{opacity:0.3;cursor:not-allowed}
  #undo-btn{position:relative}
  #undo-count{position:absolute;top:-6px;right:-6px;background:var(--gold);color:var(--dark);font-size:8px;font-weight:700;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;line-height:1}
  #hint{font-family:'Cormorant Garamond',serif;font-size:0.85rem;color:rgba(245,240,232,0.25);font-style:italic;letter-spacing:0.05em}
  #win-overlay{display:none;position:fixed;inset:0;z-index:50;background:rgba(7,9,15,0.92);align-items:center;justify-content:center;flex-direction:column;gap:1.5rem;text-align:center}
  #win-overlay.show{display:flex}
  #win-overlay h2{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,6vw,3.5rem);font-weight:300;color:var(--gold)}
  #win-overlay p{font-size:11px;letter-spacing:0.2em;color:var(--muted);text-transform:uppercase}
  .win-btn{background:var(--gold);border:1px solid var(--gold);color:var(--dark);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.15em;text-transform:uppercase;padding:0.8rem 2rem;border-radius:2px;cursor:pointer;transition:all 0.2s}
  .win-btn:hover{background:transparent;color:var(--gold)}
  #bonus-toast{display:none;position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.4);color:var(--gold);font-size:10px;letter-spacing:0.15em;text-transform:uppercase;padding:0.5rem 1.25rem;border-radius:2px;z-index:100;animation:fadeToast 2.5s ease forwards}
  @keyframes fadeToast{0%{opacity:0;transform:translateX(-50%) translateY(-8px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}
  #dpad{display:none;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px}
  @media (max-width:600px),(pointer:coarse){#dpad{display:grid}#hint{display:none}}
  .dpad-btn{background:rgba(245,240,232,0.05);border:1px solid rgba(201,168,76,0.15);color:var(--cream);font-size:16px;border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.1s;-webkit-tap-highlight-color:transparent}
  .dpad-btn:active{background:rgba(201,168,76,0.15)}
  .dpad-empty{background:transparent;border:none}
</style>
</head>
<body>
<div id="stars"></div>
<div id="bonus-toast" id="bonus-toast"></div>
<div id="game-wrap">
  <div id="top-bar">
    <a href="/" class="back-link">← dream</a>
    <div id="level-info">Level <span id="lvl-num">1</span> / <span id="lvl-total">50</span></div>
    <div id="move-info">Moves: <span id="moves">0</span></div>
  </div>
  <canvas id="canvas"></canvas>
  <div id="controls">
    <button class="ctrl-btn" id="undo-btn" onclick="undoMove()">↩ Undo<span id="undo-count">1</span></button>
    <button class="ctrl-btn" onclick="restartLevel()">↺ Restart</button>
    <button class="ctrl-btn" onclick="skipLevel()">Skip →</button>
  </div>
  <div id="dpad">
    <div class="dpad-empty"></div>
    <button class="dpad-btn" onclick="move(0,-1)">▲</button>
    <div class="dpad-empty"></div>
    <button class="dpad-btn" onclick="move(-1,0)">◀</button>
    <div class="dpad-empty"></div>
    <button class="dpad-btn" onclick="move(1,0)">▶</button>
    <div class="dpad-empty"></div>
    <button class="dpad-btn" onclick="move(0,1)">▼</button>
    <div class="dpad-empty"></div>
  </div>
  <p id="hint">arrow keys · push boxes onto targets · Z = undo</p>
</div>
<div id="win-overlay">
  <h2>Level Complete</h2>
  <p id="win-moves">Solved in <span id="win-move-count"></span> moves</p>
  <p id="win-bonus" style="color:var(--gold);display:none">+1 undo earned!</p>
  <button class="win-btn" onclick="nextLevel()">Next Level →</button>
</div>
<script>
const LEVELS=[
["    #####","    #   #","    #$  #","  ###  $##","  #  $ $ #","### # ## #   ######","#   # ## #####  ..#","# $  $          ..#","##### ### #@##  ..#","    #     #########","    #######"],
["############","#..  #     ###","#..  # $  $  #","#..  #$####  #","#..    @ ##  #","#..  # #  $ ##","###### ##$ $ #","  # $  $ $ $ #","  #    #     #","  ############"],
["  #######","  #     #","  # $#$ #","  # . . #","### ###","# $     #","#   #@###","##  #","  ###"],
["#######","#     #","#     #","#. $$ #","###$  #","  #   #","  #.@ #","  #####"],
["  #####","  #   #####","  # $ ##  #","  ## $#.  #","  # $  .###","###  $.#","#@. $.##","#####  #","    ####"],
["######  ###","#..  # ##@##","#..  ###   #","#..     $$ #","#..  # # $ #","#..### # $ #","#### $ #   #","   #  $# ##","   # $  $ ##","   #   #   #","   #########"],
["   #####","   #   #","   # # #","#### #####","#    @    #","### $#$ ###","  #  .  #","  #######"],
["########","#      #","# $$## #","# $  # #","## ## ##"," # .  #","## .# ##","#  .  @#","########"],
[" ####","##  ###","#     #","#  $# #","## $  #"," ###$ #"," #  $ #","## #. ##","#  .   #","#  .@###","########"],
["  ######","  # ..@#","  # ## ##","  #  $  #","  ## $# #","  ## $  #","#### ## #","#       #","#  ##   #","####  ###","   ####"],
["  #####","  #   #","### # ##","#  $@  #","# $.## #","## #   #"," # . ###"," #####"],
["###### ###","#    ###.#","#  $$    #","#  @  $#.#","### ##   #","  #  ####","  ####"],
["########","#   @  #","#  $$$ #","#  # # #","## # ###"," # ...#"," #####"],
["     ####","     #  ##","     # $ #"," ##### $ #","##    $  #","# . .# ###","# @    #","#######"],
["  ####","###  #","#    ###","#  $   #","### $# #","  ##   #","  # .# ##","  # .@  #","  # . ###","  #####"],
["   ####","####  #","# $   #","#   $ ##","## $   #"," # . . #"," ## .# #","  #  @ #","  ######"],
["  ######","###    #","#  $ $ #","# $ $  #","## #   ##"," # #.#. #"," # #.#. #"," #   @  #"," ########"],
["#####","#   ###","# $   #","## $# #"," ## @ ##","  ##$  #","  # .# #","  # .  #","  # .###","  ####"],
["  ####","  #  #","  #$ #","#### ##","#  $  #","#   $ #","#.#.# #","#.  @ #","#######"],
["########","#  @   #","# $$$$ #","# $    #","##.### #"," #. .# #"," #.  # #"," ######"],
["   ####","   #  #","   #  #","####$ ###","#   $   #","# $   $ #","### .#. #","  # . . #","  # . . #","  ## # ##","   #   #","   #####"],
["  #####","  #   ##","  #    #","#### $ ##","#   $   #","#  $ $  #","## . .  #"," # . .###"," #   ##"," #####"],
["  ####","  #  #","  #$ #","#### ##","#  $  #","#   $ #","#.#.# #","#.  @ #","#######"],
["#####","#   ##","#    #","# $  ###","##$   @#","# $ . .#","#   . .#","#########"],
[" ######"," #    #","## $  #","#  $$ ##","#  .  @#","## .  #"," #. ###"," ####"],
["######","#    #","# $  #","# .$ ##","## .  #"," ##$  #","  # @ #","  #####"],
["#####","#   ##","# $  #","# $. ##","## $. #"," # @. #"," #    #"," ######"],
["  ####","### ..#","# $ $ #","# $   #","##  ###"," #@##"," ###"],
["  #####","### @ #","#   $ #","# $ . #","## $. ##"," # .. #"," ######"],
["#####  ###","#   ####.#","# $  $   #","# $ .#   #","##$  #####"," #@###"," ###"],
["   ###","   # #","#### #","#    ##","# $ @ #","## $. #"," # .. #"," #    #"," ######"],
["  ####","### ..#","#   . #","# $$$ #","# $ @ #","##    #"," ######"],
[" #####"," # @ #","## $ ##","#  $  #","# . . #","###.###","  # #","  ###"],
["  ####","  #  #","### $ #","#  $@ #","# .   ##","## . $ #"," # .  #"," ######"],
["  ####","### ..#","# $ . #","# $   #","## $###"," # @##"," ###"],
[" ######"," # @  #","## $  #","#  $$ #","# .   #","## . ##"," # .##"," ####"],
["  ####","### @ #","#   $ ##","# . $  #","## . $ #"," ##.   #","  #####"],
["#####","#   ##","# $  #","# .$ ##","## .  #"," ##$@ #","  #   #","  #####"],
[" #####"," # @ #","## $ #","#  $.##","#  $  #","## .  #"," ##.###"," ####"],
["  ######","  # @  #","###    #","# $$$  #","#  . . ##","## . .  #"," #######"],
["   ####","####  #","#  $  #","# $ $ #","## $  #"," # .@.#"," # . .#"," ######"],
["  ####","### @ #","# $   #","# $ . #","## $. ##"," # .. #"," ######"],
["###### ####","#    ###  #","# $$    . #","#  $$ #.  #","## @  # . #"," ########"],
["  #####","### @ #","# $   ##","# $ .  #","## $ . #"," # . ###"," #####"],
[" ######"," # @  #","## $  ##","# $ $  #","#  .   #","## . ###"," # .##"," ####"],
["   ####","####  ##","# $    #","# $ $@ #","## . . #"," ##. ###"," ####"],
["  ####","### @ #","# $   #","# $. $ #","## . $ #"," ##.   #","  #####"],
[" ######"," # @  #","## $$  #","#  $ . #","#  .   ##","## .  $#"," # .  #"," ######"],
["  ####","### @ #","#   $ #","# $. $ #","## $. ##"," # ..  #"," #   ###"," #####"],
["######","# @  #","# $$ #","# $  ##","##.   #"," #. . #"," #.   #"," ######"]
];

const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let currentLevel=0,grid=[],playerX=0,playerY=0,moves=0,history=null;
let undosLeft=1,levelsWithoutUndo=0,undoUsedThisLevel=false;
const MAX_UNDO=3;
const WALL=1,FLOOR=2,BOX=3,TARGET=4,BOX_T=5,PLAYER=6,PLR_T=7;

function updateUndoBtn(){
  const btn=document.getElementById('undo-btn');
  const cnt=document.getElementById('undo-count');
  cnt.textContent=undosLeft;
  btn.disabled=undosLeft<=0||!history;
}

function showToast(msg){
  const t=document.getElementById('bonus-toast');
  t.textContent=msg;
  t.style.display='block';
  setTimeout(()=>t.style.display='none',2500);
}

function parseLevel(lvl){
  const rows=lvl,h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const g=[];let px=0,py=0;
  for(let y=0;y<h;y++){g[y]=[];for(let x=0;x<w;x++){const ch=(rows[y][x]||' ');switch(ch){case'#':g[y][x]=WALL;break;case' ':g[y][x]=0;break;case'.':g[y][x]=TARGET;break;case'$':g[y][x]=BOX;break;case'*':g[y][x]=BOX_T;break;case'@':g[y][x]=PLAYER;px=x;py=y;break;case'+':g[y][x]=PLR_T;px=x;py=y;break;default:g[y][x]=0;}}}
  return{grid:g,px,py,width:w,height:h};
}

function loadLevel(idx){
  const p=parseLevel(LEVELS[idx]);
  grid=p.grid;playerX=p.px;playerY=p.py;moves=0;history=null;undoUsedThisLevel=false;
  document.getElementById('lvl-num').textContent=idx+1;
  document.getElementById('lvl-total').textContent=LEVELS.length;
  document.getElementById('moves').textContent=0;
  resizeCanvas(p.width,p.height);
  updateUndoBtn();
  draw();
}

function resizeCanvas(w,h){
  const maxW=Math.min(window.innerWidth-32,520);
  const maxH=window.innerHeight-220;
  const t=Math.max(14,Math.min(Math.floor(maxW/w),Math.floor(maxH/h),40));
  canvas.width=w*t;canvas.height=h*t;canvas._tile=t;
}

function draw(){
  const t=canvas._tile||32,h=grid.length,w=grid[0].length;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let y=0;y<h;y++){for(let x=0;x<w;x++){
    const cell=grid[y][x],px=x*t,py=y*t;
    if(cell===0)continue;
    if(cell===WALL){ctx.fillStyle='#1a1f35';ctx.fillRect(px,py,t,t);ctx.strokeStyle='rgba(201,168,76,0.25)';ctx.lineWidth=0.5;ctx.strokeRect(px+.5,py+.5,t-1,t-1);ctx.fillStyle='rgba(201,168,76,0.06)';ctx.fillRect(px+2,py+2,t-4,t-4);}
    else{ctx.fillStyle='#0a0d18';ctx.fillRect(px,py,t,t);}
    if(cell===TARGET||cell===PLR_T){ctx.strokeStyle='#c9a84c';ctx.lineWidth=1.5;const m=t*.3;ctx.strokeRect(px+m,py+m,t-m*2,t-m*2);ctx.fillStyle='rgba(201,168,76,0.1)';ctx.fillRect(px+m,py+m,t-m*2,t-m*2);}
    if(cell===BOX||cell===BOX_T){const m=t*.1,on=cell===BOX_T;ctx.fillStyle=on?'rgba(74,158,218,0.3)':'rgba(74,158,218,0.15)';ctx.fillRect(px+m,py+m,t-m*2,t-m*2);ctx.strokeStyle=on?'#4a9eda':'rgba(74,158,218,0.5)';ctx.lineWidth=on?2:1;ctx.strokeRect(px+m+.5,py+m+.5,t-m*2-1,t-m*2-1);if(on){ctx.fillStyle='#4a9eda';ctx.font=`bold ${t*.35}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✓',px+t/2,py+t/2);}}
    if(cell===PLAYER||cell===PLR_T)drawPlayer(px+t/2,py+t/2,t);
  }}
}

function drawPlayer(cx,cy,t){
  const s=t*.18;ctx.strokeStyle='#f5f0e8';ctx.lineWidth=Math.max(1.5,t*.07);ctx.lineCap='round';
  ctx.beginPath();ctx.arc(cx,cy-s*2.2,s,0,Math.PI*2);ctx.fillStyle='#f5f0e8';ctx.fill();
  ctx.beginPath();ctx.moveTo(cx,cy-s*1.2);ctx.lineTo(cx,cy+s*1.2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-s*1.2,cy-s*.3);ctx.lineTo(cx+s*1.2,cy-s*.3);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx,cy+s*1.2);ctx.lineTo(cx-s*.9,cy+s*2.5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx,cy+s*1.2);ctx.lineTo(cx+s*.9,cy+s*2.5);ctx.stroke();
}

function move(dx,dy){
  const nx=playerX+dx,ny=playerY+dy;
  if(ny<0||ny>=grid.length||nx<0||nx>=grid[0].length)return;
  const dest=grid[ny][nx];
  if(dest===WALL||dest===0)return;
  const snap=JSON.parse(JSON.stringify(grid));
  const spx=playerX,spy=playerY;
  if(dest===BOX||dest===BOX_T){
    const bx=nx+dx,by=ny+dy;
    if(by<0||by>=grid.length||bx<0||bx>=grid[0].length)return;
    const beyond=grid[by][bx];
    if(beyond===WALL||beyond===0||beyond===BOX||beyond===BOX_T)return;
    grid[by][bx]=(beyond===TARGET)?BOX_T:BOX;
    grid[ny][nx]=(dest===BOX_T)?TARGET:FLOOR;
  }
  grid[spy][spx]=(grid[spy][spx]===PLR_T)?TARGET:FLOOR;
  grid[ny][nx]=(grid[ny][nx]===TARGET)?PLR_T:PLAYER;
  playerX=nx;playerY=ny;moves++;
  document.getElementById('moves').textContent=moves;
  history={grid:snap,px:spx,py:spy,moves:moves-1};
  updateUndoBtn();draw();checkWin();
}

function undoMove(){
  if(!history||undosLeft<=0)return;
  grid=history.grid;playerX=history.px;playerY=history.py;moves=history.moves;
  document.getElementById('moves').textContent=moves;
  history=null;undosLeft--;undoUsedThisLevel=true;
  updateUndoBtn();draw();
}

function restartLevel(){loadLevel(currentLevel);}

function skipLevel(){
  levelsWithoutUndo=0;
  currentLevel=(currentLevel+1)%LEVELS.length;
  loadLevel(currentLevel);
}

function nextLevel(){
  document.getElementById('win-overlay').classList.remove('show');
  document.getElementById('win-bonus').style.display='none';
  if(!undoUsedThisLevel){
    levelsWithoutUndo++;
    if(levelsWithoutUndo>=10&&undosLeft<MAX_UNDO){
      undosLeft++;levelsWithoutUndo=0;
      showToast('+1 undo earned!');
    }
  } else {
    levelsWithoutUndo=0;
  }
  currentLevel=(currentLevel+1)%LEVELS.length;
  loadLevel(currentLevel);
}

function checkWin(){
  for(let y=0;y<grid.length;y++)for(let x=0;x<grid[y].length;x++)if(grid[y][x]===BOX)return;
  const ov=document.getElementById('win-overlay');
  document.getElementById('win-move-count').textContent=moves;
  const bonus=!undoUsedThisLevel&&levelsWithoutUndo+1>=10&&undosLeft<MAX_UNDO;
  document.getElementById('win-bonus').style.display=bonus?'block':'none';
  ov.classList.add('show');
}

document.addEventListener('keydown',e=>{
  switch(e.key){
    case'ArrowUp':case'w':case'W':e.preventDefault();move(0,-1);break;
    case'ArrowDown':case's':case'S':e.preventDefault();move(0,1);break;
    case'ArrowLeft':case'a':case'A':e.preventDefault();move(-1,0);break;
    case'ArrowRight':case'd':case'D':e.preventDefault();move(1,0);break;
    case'z':case'Z':undoMove();break;
    case'r':case'R':restartLevel();break;
  }
});

let tx=0,ty=0;
canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;e.preventDefault();},{passive:false});
canvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy>0?1:-1);
  e.preventDefault();
},{passive:false});

const starsEl=document.getElementById('stars');
for(let i=0;i<120;i++){const s=document.createElement('div');s.className='star';const sz=Math.random()<.8?1:2;s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*6}s;--peak:${0.3+Math.random()*.7};`;starsEl.appendChild(s);}

loadLevel(0);
window.addEventListener('resize',()=>{const p=parseLevel(LEVELS[currentLevel]);resizeCanvas(p.width,p.height);draw();});
</script>
</body>
</html>
